<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MMA Search Lab</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#10161f;color:#e9eef4}*{box-sizing:border-box}body{margin:0;padding:22px 16px 60px;max-width:780px;margin-inline:auto}h1{font-size:1.35rem;letter-spacing:.06em;margin:10px 0 5px}p{color:#b2c0cf;line-height:1.55}small{color:#aebbc9}label{display:block;margin:17px 0 7px;color:#bccbda}.tag{font-size:12px;color:#b9d9e4;border:1px solid #465a69;border-radius:30px;padding:4px 9px;display:inline-block}.line{display:flex;gap:9px}input{min-width:0;flex:1;width:100%;background:#121b26;border:1px solid #536579;border-radius:10px;padding:14px 12px;color:#fff;font-size:17px}button{background:#c9e8ef;color:#14202a;border:0;border-radius:10px;padding:12px 15px;font-size:16px;font-weight:650;cursor:pointer}button:disabled{opacity:.5}button.ghost{background:#293644;color:#eff4f7;border:1px solid #556879}.status{margin:18px 0;padding:12px;background:#202a36;border-radius:10px;min-height:40px}.result{padding:15px 0;border-bottom:1px solid #3a4858}.title{font-size:18px;font-weight:700;line-height:1.3}.meta{color:#aebdca;margin-top:5px;font-size:14px}.pills{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.pills button{font-size:13px;padding:8px 10px}.pills .chosen{background:#c9e8ef;color:#14202a}.muted{color:#aebdca}.error{color:#ffb2a5}.help{font-size:13px;color:#a9b6c3;margin-top:15px}#loadMore{display:none;width:100%;margin-top:16px}</style></head><body>
<span class="tag">SEARCH TEST · データ保存なし</span><h1>MY MUSIC ARCHIVE / Search Lab</h1><p>MusicBrainz検索ロジックの検証専用ページ。通常版MMAの保存データは読み書きしません。</p>
<label for="q">アーティスト名または作品名</label><form id="searchForm" class="line"><input id="q" type="search" placeholder="phoebe bridgers" required autocomplete="off"><button id="submit" type="submit">検索</button></form>
<div id="status" class="status">例：phoebe bridgers / porridge radio / punisher / radiohead</div><div id="mode" class="pills" hidden></div><div id="results"></div><button id="loadMore" class="ghost" type="button">さらに30件</button><p class="help">※ 本ページは検証用です。MusicBrainzのAPI応答や通信環境によって結果が変わることがあります。短時間の連続検索は避けてください。</p>
<script src="../search.js"></script><script>
'use strict';
const $=id=>document.getElementById(id);
const state={query:'',items:[],visible:30,request:0,mode:'',artist:null,offset:0,exhausted:true,loading:false};
function status(s,isError=false){$('status').textContent=s;$('status').className='status'+(isError?' error':'')}
function context(seq){return {isCurrent:()=>seq===state.request,onRetry:({code,attempt,delay})=>status(`再試行中（${code?'HTTP '+code:'通信エラー'}）：${attempt}/3、約${Math.ceil(delay/1000)}秒後…`)}}
function render(){
 const items=state.items.slice(0,state.visible),root=$('results');root.replaceChildren();
 for(const item of items){
  const article=document.createElement('article');article.className='result';const ttl=document.createElement('div');ttl.className='title';ttl.textContent=item.title||'(no title)';
  const m=document.createElement('div');m.className='meta';m.textContent=[MMASearch.credit(item)||'アーティスト情報なし',item['primary-type']||'Unknown',item['first-release-date']||'発売日不明'].join(' · ');article.append(ttl,m);root.append(article);
 }
 $('loadMore').style.display=state.items.length>state.visible||!state.exhausted?'block':'none';
 status(items.length?`${state.mode}：${state.items.length}件を取得・整理、${items.length}件表示`:'該当する作品が見つかりませんでした。');
}
function begin(){const seq=++state.request;Object.assign(state,{items:[],visible:30,offset:0,exhausted:true,loading:true});$('results').replaceChildren();$('loadMore').style.display='none';return seq}
function modes(artists,q){
 const el=$('mode');el.replaceChildren();el.hidden=false;
 const title=document.createElement('button');title.className='ghost';title.textContent='作品名で検索';title.onclick=()=>runTitle(q);el.append(title);
 for(const a of artists.slice(0,4)){const b=document.createElement('button');b.className='ghost';b.textContent=`アーティスト：${a.name}${a.disambiguation?' ('+a.disambiguation+')':''}`;b.onclick=()=>runArtist(a);el.append(b)}
}
async function runArtist(a){
 const seq=begin(),ctx=context(seq);state.artist=a;state.mode=`${a.name} の作品`;status('作品を取得しています…');
 try{const items=await MMASearch.browseArtist(a.id,ctx);if(!ctx.isCurrent())return;state.items=items;render()}
 catch(e){if(ctx.isCurrent())status('検索エラー：'+e.message+'。再検索できます。',true)}finally{if(ctx.isCurrent())state.loading=false}
}
async function runTitle(q){
 const seq=begin(),ctx=context(seq);state.artist=null;state.mode='作品名検索';state.query=q;status('作品名で検索しています…');
 try{const page=await MMASearch.titlePage(q,0,ctx);if(!ctx.isCurrent())return;Object.assign(state,page);render()}
 catch(e){if(ctx.isCurrent())status('検索エラー：'+e.message+'。再検索できます。',true)}finally{if(ctx.isCurrent())state.loading=false}
}
async function search(q){
 const seq=begin(),ctx=context(seq);state.query=q;state.artist=null;state.mode='';$('mode').hidden=true;status('アーティスト名を照合しています…');
 try{const artists=await MMASearch.artistSearch(q,ctx);if(!ctx.isCurrent())return;modes(artists,q);if(artists.length)await runArtist(artists[0]);else await runTitle(q)}
 catch(e){if(ctx.isCurrent())status('検索エラー：'+e.message+'。再検索できます。',true)}finally{if(ctx.isCurrent())state.loading=false}
}
$('searchForm').onsubmit=e=>{e.preventDefault();const q=$('q').value.trim();if(q)search(q)};
$('loadMore').onclick=async()=>{
 if(state.loading)return;const seq=state.request,ctx=context(seq),visible=state.visible+30;state.loading=true;$('loadMore').disabled=true;
 try{
  let next={items:[...state.items],offset:state.offset,exhausted:state.exhausted};
  while(next.items.length<visible&&!next.exhausted){const page=await MMASearch.titlePage(state.query,next.offset,ctx);next={...page,items:MMASearch.unique([...next.items,...page.items])}}
  if(!ctx.isCurrent())return;Object.assign(state,next,{visible});render();
 }catch(e){if(ctx.isCurrent())status('検索エラー：'+e.message+'。もう一度「さらに30件」を押してください。',true)}
 finally{if(ctx.isCurrent())state.loading=false;$('loadMore').disabled=false}
};
</script></body></html>
