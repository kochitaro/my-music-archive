<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MMA Search Lab</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#10161f;color:#e9eef4}*{box-sizing:border-box}body{margin:0;padding:22px 16px 60px;max-width:780px;margin-inline:auto}h1{font-size:1.35rem;letter-spacing:.06em;margin:10px 0 5px}p{color:#b2c0cf;line-height:1.55}small{color:#aebbc9}label{display:block;margin:17px 0 7px;color:#bccbda}.tag{font-size:12px;color:#b9d9e4;border:1px solid #465a69;border-radius:30px;padding:4px 9px;display:inline-block}.line{display:flex;gap:9px}input{min-width:0;flex:1;width:100%;background:#121b26;border:1px solid #536579;border-radius:10px;padding:14px 12px;color:#fff;font-size:17px}button{background:#c9e8ef;color:#14202a;border:0;border-radius:10px;padding:12px 15px;font-size:16px;font-weight:650;cursor:pointer}button:disabled{opacity:.5}button.ghost{background:#293644;color:#eff4f7;border:1px solid #556879}.status{margin:18px 0;padding:12px;background:#202a36;border-radius:10px;min-height:40px}.result{padding:15px 0;border-bottom:1px solid #3a4858}.title{font-size:18px;font-weight:700;line-height:1.3}.meta{color:#aebdca;margin-top:5px;font-size:14px}.pills{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.pills button{font-size:13px;padding:8px 10px}.pills .chosen{background:#c9e8ef;color:#14202a}.muted{color:#aebdca}.error{color:#ffb2a5}.help{font-size:13px;color:#a9b6c3;margin-top:15px}#loadMore{display:none;width:100%;margin-top:16px}</style></head><body>
<span class="tag">SEARCH TEST · データ保存なし</span><h1>MY MUSIC ARCHIVE / Search Lab</h1><p>MusicBrainz検索ロジックの検証専用ページ。通常版MMAの保存データは読み書きしません。</p>
<label for="q">アーティスト名または作品名</label><form id="searchForm" class="line"><input id="q" type="search" placeholder="phoebe bridgers" required autocomplete="off"><button id="submit" type="submit">検索</button></form>
<div id="status" class="status">例：phoebe bridgers / porridge radio / punisher / radiohead</div><div id="mode" class="pills" hidden></div><div id="results"></div><button id="loadMore" class="ghost" type="button">さらに30件</button><p class="help">※ 本ページは検証用です。MusicBrainzのAPI応答や通信環境によって結果が変わることがあります。短時間の連続検索は避けてください。</p>
<script>
'use strict';
const $=id=>document.getElementById(id);let state={query:'',items:[],visible:30,request:0,mode:'',artist:null};
const norm=s=>(s||'').normalize('NFKC').toLocaleLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();
const date=s=>/^\d{4}(-\d{2}){0,2}$/.test(s||'')?s:'';
const typeRank=t=>({Album:0,EP:1,Single:2})[t]??3;
const sorter=(a,b)=>typeRank(a['primary-type'])-typeRank(b['primary-type'])||date(b['first-release-date']).localeCompare(date(a['first-release-date']))||a.title.localeCompare(b.title);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// API呼び出しは検索ボタンの連打や再試行も含めて直列化する。
let lastCall=0,apiQueue=Promise.resolve();
const apiCache=new Map(),pending=new Map(),CACHE_MS=5*60*1000,CACHE_LIMIT=180;
let retryNotice='';
function mb(url){
  const cached=apiCache.get(url);
  if(cached&&Date.now()-cached.at<CACHE_MS)return Promise.resolve(cached.data);
  if(pending.has(url))return pending.get(url);
  const job=apiQueue.catch(()=>{}).then(async()=>{
    for(let attempt=0;attempt<4;attempt++){
      const interval=Math.max(0,1250-(Date.now()-lastCall));
      if(interval)await sleep(interval);
      lastCall=Date.now();
      let response;
      try{response=await fetch(url,{headers:{Accept:'application/json'}})}
      catch(e){
        if(attempt===3)throw new Error('通信できません。接続を確認して再検索してください');
        retryNotice=`通信が不安定です。${attempt+1}/3 回目の再試行を待っています…`;
        status(retryNotice);await sleep(2000*(attempt+1));continue;
      }
      if(response.ok){
        const data=await response.json();
        apiCache.set(url,{data,at:Date.now()});
        if(apiCache.size>CACHE_LIMIT)apiCache.delete(apiCache.keys().next().value);
        retryNotice='';return data;
      }
      if(![429,502,503,504].includes(response.status)||attempt===3){
        throw new Error(`MusicBrainz HTTP ${response.status}${attempt===3?'（再試行しても復旧しませんでした）':''}`);
      }
      const retryAfter=response.headers.get('Retry-After');
      const numeric=retryAfter&&/^\d+(?:\.\d+)?$/.test(retryAfter.trim())?Number(retryAfter)*1000:null;
      const wait=Math.min(15000,Math.max(2000*(attempt+1),numeric||0));
      retryNotice=`MusicBrainzが混雑しています（HTTP ${response.status}）。${attempt+1}/3 回目の再試行まで約${Math.ceil(wait/1000)}秒…`;
      status(retryNotice);await sleep(wait);
    }
  });
  apiQueue=job.catch(()=>{});
  pending.set(url,job);
  job.finally(()=>pending.delete(url)).catch(()=>{});
  return job;
}
function status(s,isError=false){$('status').textContent=s;$('status').className='status'+(isError?' error':'')}
function query(q){return encodeURIComponent(q)}
// MusicBrainzの別名に読みが登録されていない場合の最小限の補助辞書。
// 作品情報は引き続きMusicBrainzから取得し、辞書は名前の解決だけに使用する。
const artistReadingOverrides=[{reading:'おぶくろなりあき',artist:'小袋成彬'}];
const kanaToHiragana=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
async function artistSearch(q){
  const n=norm(q);
  const reading=kanaToHiragana(n.replace(/\s+/g,''));
  const override=artistReadingOverrides.find(x=>reading.length>=4&&x.reading.startsWith(reading));
  if(override&&norm(q)!==norm(override.artist))return artistSearch(override.artist);
  const escapeLucene=s=>s.replace(/[+\-!(){}\[\]^"~*?:\\/|&]/g,'\\$&');
  // MusicBrainzの「artist」検索では日本語の別名を拾えないため「alias」も明示検索。
  // 検索レスポンスにaliases配列がない場合でも、aliasヒットを候補として扱う。
  const phrase=escapeLucene(q.trim());
  const exactQuery=`artist:"${phrase}" OR alias:"${phrase}"`;
  const exactData=await mb(`https://musicbrainz.org/ws/2/artist/?query=${query(exactQuery)}&fmt=json&limit=50`);
  const candidates=exactData.artists||[];
  const exact=candidates.filter(a=>norm(a.name)===n||(a.aliases||[]).some(x=>norm(x.name)===n));
  if(exact.length)return exact.sort((a,b)=>(b.score||0)-(a.score||0));
  // Luceneの別名一致で高評価の候補を採用する（別名配列が返らない場合の対策）。
  const high=candidates.filter(a=>Number(a.score||0)>=85);
  if(high.length)return high.slice(0,8);
  if(n.length<3)return [];
  // 英語名などの先頭部分一致も残す。
  const words=n.split(/\s+/).filter(Boolean);
  if(words.length>8)return [];
  const lucene=words.map(w=>`(artist:${escapeLucene(w)}* OR alias:${escapeLucene(w)}*)`).join(' AND ');
  const data=await mb(`https://musicbrainz.org/ws/2/artist/?query=${query(lucene)}&fmt=json&limit=100`);
  return (data.artists||[]).filter(a=>[a.name,...(a.aliases||[]).map(x=>x.name)].some(name=>norm(name).startsWith(n))||Number(a.score||0)>=90).sort((a,b)=>{
    const rank=a=>norm(a.name).startsWith(n)?0:1;
    return rank(a)-rank(b)||(b.score||0)-(a.score||0);
  }).slice(0,15);
}
async function browseArtist(id,seq){let all=[];for(let offset=0;offset<600;offset+=100){const data=await mb(`https://musicbrainz.org/ws/2/release-group/?artist=${encodeURIComponent(id)}&fmt=json&limit=100&offset=${offset}`);if(seq!==state.request)return null;all.push(...(data['release-groups']||[]));if((data['release-groups']||[]).length<100)break;}const seen=new Set();return all.filter(x=>{if(!['Album','EP','Single'].includes(x['primary-type']))return false;if(seen.has(x.id))return false;seen.add(x.id);return true}).sort(sorter)}
async function titleSearch(q){const data=await mb(`https://musicbrainz.org/ws/2/release-group/?query=${query('releasegroup:"'+q.replace(/"/g,'')+'"')}&fmt=json&limit=100`);const arr=data['release-groups']||[];arr.sort((a,b)=>Number(norm(b.title)===norm(q))-Number(norm(a.title)===norm(q))||(b.score||0)-(a.score||0)||sorter(a,b));return arr}
function render(){const items=state.items.slice(0,state.visible);const root=$('results');root.replaceChildren();for(const item of items){const article=document.createElement('article');article.className='result';const ttl=document.createElement('div');ttl.className='title';ttl.textContent=item.title||'(no title)';const m=document.createElement('div');m.className='meta';const artist=(item['artist-credit']||[]).map(x=>typeof x==='string'?x:(x.name||x.artist?.name||'')).join('');m.textContent=[artist,item['primary-type']||'Unknown',item['first-release-date']||'発売日不明'].filter(Boolean).join(' · ');article.append(ttl,m);root.append(article)}$('loadMore').style.display=state.items.length>state.visible?'block':'none';if(state.items.length)status(`${state.mode}：${state.items.length}件を取得・整理、${items.length}件表示`);else if(state.mode)status('該当する作品が見つかりませんでした。')}
function modes(artists,q){const el=$('mode');el.replaceChildren();el.hidden=false;const title=document.createElement('button');title.className='ghost';title.textContent='作品名で検索';title.onclick=()=>runTitle(q);el.append(title);for(const a of artists.slice(0,4)){const b=document.createElement('button');b.textContent=`アーティスト：${a.name}${a.disambiguation?' ('+a.disambiguation+')':''}`;b.className=state.artist?.id===a.id?'chosen':'ghost';b.onclick=()=>runArtist(a);el.append(b)}}
async function runArtist(a){const seq=++state.request;state.artist=a;state.items=[];state.visible=30;state.mode=`${a.name} の作品`;status(`${a.name} の作品を取得しています…（作品数によって時間がかかります）`);$('results').replaceChildren();try{const records=await browseArtist(a.id,seq);if(seq!==state.request)return;state.items=records||[];render()}catch(e){if(seq===state.request)status('アーティスト作品取得エラー：'+e.message,true)}}
async function runTitle(q){const seq=++state.request;state.artist=null;state.items=[];state.visible=30;state.mode='作品名検索';status('作品名を検索中…');$('results').replaceChildren();try{const records=await titleSearch(q);if(seq!==state.request)return;state.items=records;render()}catch(e){if(seq===state.request)status('作品名検索エラー：'+e.message,true)}}
async function search(q){const seq=++state.request;state.query=q;state.items=[];state.artist=null;state.visible=30;state.mode='';$('mode').hidden=true;$('results').replaceChildren();$('loadMore').style.display='none';status('アーティスト名を照合しています…');$('submit').disabled=true;try{const artists=await artistSearch(q);if(seq!==state.request)return;modes(artists,q);if(artists.length){await runArtist(artists[0])}else{await runTitle(q)}}catch(e){if(seq===state.request)status('検索エラー：'+e.message+'。しばらくして再試行してください。',true)}finally{$('submit').disabled=false}}
$('searchForm').onsubmit=e=>{e.preventDefault();const q=$('q').value.trim();if(q)search(q)};
$('loadMore').onclick=()=>{state.visible+=30;render()};
</script></body></html>
